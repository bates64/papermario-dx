# Maps source directories to the ROM segment they link into.
#
# A .c/.cpp/.s file belongs to the segment declared by its nearest ancestor
# directory, so adding a source file to an existing directory needs no edit here.
# Only creating a new segment does.

# Sources built as separate overlays, so they belong to no ROM segment.
exclude:
  - src/battle/actor/*
  - src/world/area/*/*/
  # Provided by the prebuilt libultra archive rather than compiled from source.
  - src/os/_getcount.c
  - src/os/_setcompare.c
  - src/os/flashreadarray.c
  - src/os/flashsectorerase.c
  - src/os/flashwritearray.c
  - src/os/flashwritebuffer.c
  - src/os/guMtxCat.s
  - src/os/padding_alt.s
  - src/os/pfssearchfile.c
  - src/os/si.c
  - src/os/skapi.s

