# Which segment links each asset object, matched by the directory it sits in.
# A directory marked "each" gives every file its own segment, named by the
# file's stem with any prefix given.
assets:
  dirs:
    asm/effects: main
    ver/us/asm: header
    assets/us/imgfx: imgfx_data
    assets/us/logos: logos
    assets/us/sprite: sprites
    assets/us/ui/files: menu_hud_scripts
    assets/us/ui/pause: menu_hud_scripts
  each:
    assets/us/title: 'title/'
  files:
    ver/us/asm/header.s: header
    assets/us/audio.sbn: sbn
    assets/us/copy_1942C40.bin: copy_1942C40
    assets/us/copy_1B8220C.bin: copy_1B8220C
    assets/us/copy_1E00000.bin: copy_1E00000
    assets/us/copy_27FEE22.bin: copy_27FEE22
    assets/us/gspF3DEX2kawase_fifo_data.bin: main
    assets/us/gspF3DEX2kawase_fifo_text.bin: main
    assets/us/icons.bin: icon
    assets/us/libgcc_vr4300.a: main
    assets/us/mapfs.dat: mapfs
    assets/us/msg: msg
    assets/us/n_aspMain_data.bin: main
    assets/us/n_aspMain_text.bin: main
    assets/us/pad_1B82208.bin: pad_1B82208
    assets/us/rspboot_font.bin: boot
    assets/us/sprite_shading_profiles.bin: sprite_shading_profiles
    assets/us/unk_1C84D30.bin: unk_1C84D30

# Directories whose images are packed into a larger blob rather than being
# textures in their own right.
packed:
  - assets/us/sprite
  - assets/us/mapfs
  - assets/us/icon
  - assets/us/charset/standard
  - assets/us/charset/subtitle
  - assets/us/charset/title

# Fonts, each packed from the glyphs and palettes in its directory.
charsets:
  - standard
  - subtitle
  - title


# Where a segment's sources live.
#
# A directory belongs to the segment its path names, so src/battle/area/arn
# holds battle/area/arn and src/engine1 holds engine1. A directory that names
# no segment belongs to the one its parent does, and src itself is main, so
# adding a source file needs no entry here.
sources:
  # Directories whose segment is not the one their path names.
  dirs:
    src/world/area/dgb: dgb_01_smash_bridges

  # Directories where every source is its own segment, named <prefix><stem>.
  each:
    src/battle/overlay: ''
    src/effects/gfx: effect_gfx_
    src/entity/model: entity_model_
    src/heaps: ''
    src/indicator_icon: ''
    src/obfuscated: ''
    src/world/model_anim/kzn: world_model_anim_kzn_

  # Sources the rules above cannot place.
  files:
    src/boot/entry_point.s: main
    src/boot/ipl3_boot.s: boot

  # Sources that build separately, or not for this version.
  exclude:
    - src/battle/actor/*
    - src/world/area/*/*/
    - src/os/padding_alt.s
    - src/os/skapi.s

# Compiler flags for sources that need something other than the default,
# by directory and then by file.
cflags:
  dirs:
    src/gcc: -g2
    src/os: -O3
    src/os/nusys: ''
  files:
    src/effects/aura.c: -Os
    src/effects/energy_in_out.c: -Os
    src/effects/firework_rocket.c: -Os
    src/effects/light_rays.c: -Os
    src/effects/stars_shimmer.c: -Os
    src/effects/tubba_heart_attack.c: -Os
    src/is_debug.c: -g -fforce-addr
    src/os/createmesgqueue.c: ''
    src/os/memset.c: -O1
    src/os/nusys/nugfxtaskmgr.c: -fforce-addr
    src/os/osFlash.c: ''
    src/os/osSiDeviceBusy.c: ''
    src/os/sqrtf.c: -ffast-math
    src/os/strcmp.c: -O1
    src/os/strcpy.c: -O1
    src/os/strncmp.c: ''
    src/os/vimodempallan1.c: ''
    src/os/vimodentsclan1.c: ''
    src/os/vimodepallan1.c: ''
