# Where each segment lives in the ROM.
#
# Segments are laid out in the order listed, each starting where the previous
# one ended. A segment's VRAM address comes from its class, so segments sharing
# a class overlay one another in RAM. Adding a segment means adding a line here;
# adding a source file to an existing segment does not.
#
# max_size, where given, is the space the segment has to fit in; the build
# fails if it outgrows it.

# Asset layers, highest priority first.
asset_stack:
  - mod
  - dx
  - us

classes:
  battle_area: { vram: 0x80218000, vram_symbol: heaps_legacy_VRAM_END }
  battle_area2: { vram: 0x80231000, vram_symbol: Vine1Base }
  battle: { vram: 0x8023E000, follows: [battle_area] }
  battle_move: { vram: 0x802A1000, follows: [battle] }
  dgb_01_smash_bridges: { vram: 0x80200000, vram_symbol: D_80200000 }
  effect_gfx: { vram: 0x9000000 }
  engine1: { vram: 0x800DC500, follows: [main] }
  engine2: { vram: 0x8010F6D0, vram_symbol: engine1_VRAM_END }
  engine4: { vram: 0x802DBD40, vram_symbol: evt_VRAM_END }
  entity: { vram: 0x802E0D90, vram_symbol: engine4_VRAM_END }
  entity_model: { vram: 0xA000000 }
  entity_model_anim: { vram: 0x0 }
  evt: { vram: 0x802C3000, vram_symbol: world_use_item_VRAM_END }
  filemenu_pause: { vram: 0x80242BA0, vram_symbol: menu_hud_scripts_VRAM_END }
  font_width: { vram: 0x802EB3D0, vram_symbol: entity_VRAM_END }
  heaps: { vram: 0x80197000, vram_symbol: engine2_VRAM_END }
  # Several callers and packed assets address this scratch region directly.
  heaps_legacy: { vram: 0x80200000 }
  # Maps occupy the fixed runtime overlay window 0x80240000..0x80267FF0.
  heaps2: { vram: 0x80267FF0 }
  heaps3: { vram: 0x802FB800, vram_symbol: font_width_VRAM_END }
  indicator_icon: { vram: 0x802B7000, follows: [texture_memory] }
  main: { vram: 0x80025C00 }
  model_clear_render_tasks: { vram: 0x802B7E00, follows: [indicator_icon] }
  texture_memory: { vram: 0x8028E000, follows: [battle, world_script_api] }
  menu_hud_scripts: { vram: 0x8023E000, vram_symbol: battle_CLASS_VRAM }
  world_model_anim: { vram: 0x80234000, vram_symbol: Vine0Base }
  world_script_api: { vram: 0x80280000, follows: [heaps2] }
  world_use_item: { vram: 0x802C0000, follows: [model_clear_render_tasks] }

segments:
  # Runtime overlays are discovered from their source families and built
  # separately; this list contains only resident code and asset/data segments.
