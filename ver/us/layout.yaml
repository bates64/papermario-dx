# Where each segment lives in the ROM.
#
# Segments are laid out in the order listed, each starting where the previous
# one ended. A segment's VRAM address comes from its class, so segments sharing
# a class overlay one another in RAM. A segment may be declared directly or by
# expanding a per-source family from sources.each below.
#
# max_size, where given, is the space the segment has to fit in; the build
# fails if it outgrows it.

# Asset layers, highest priority first.
asset_stack:
  - mod
  - dx
  - us

classes:
  battle_area: { vram: 0x80218000, vram_symbol: heaps_legacy_VRAM_END }
  battle_area2: { vram: 0x80231000, vram_symbol: Vine1Base }
  battle: { vram: 0x8023E000, follows: [battle_area] }
  battle_move: { vram: 0x802A1000, follows: [battle] }
  dgb_01_smash_bridges: { vram: 0x80200000, vram_symbol: D_80200000 }
  effect_gfx: { vram: 0x9000000 }
  engine1: { vram: 0x800DC500, follows: [main] }
  engine2: { vram: 0x8010F6D0, vram_symbol: engine1_VRAM_END }
  engine4: { vram: 0x802DBD40, vram_symbol: evt_VRAM_END }
  entity: { vram: 0x802E0D90, vram_symbol: engine4_VRAM_END }
  entity_model: { vram: 0xA000000 }
  entity_model_anim: { vram: 0x0 }
  evt: { vram: 0x802C3000, vram_symbol: world_use_item_VRAM_END }
  filemenu_pause: { vram: 0x80242BA0, vram_symbol: menu_hud_scripts_VRAM_END }
  font_width: { vram: 0x802EB3D0, vram_symbol: entity_VRAM_END }
  heaps: { vram: 0x80197000, vram_symbol: engine2_VRAM_END }
  # Several callers and packed assets address this scratch region directly.
  heaps_legacy: { vram: 0x80200000 }
  # Maps occupy the fixed runtime overlay window 0x80240000..0x80267FF0.
  heaps2: { vram: 0x80267FF0 }
  heaps3: { vram: 0x802FB800, vram_symbol: font_width_VRAM_END }
  indicator_icon: { vram: 0x802B7000, follows: [texture_memory] }
  main: { vram: 0x80025C00 }
  model_clear_render_tasks: { vram: 0x802B7E00, follows: [indicator_icon] }
  texture_memory: { vram: 0x8028E000, follows: [battle, world_script_api] }
  menu_hud_scripts: { vram: 0x8023E000, vram_symbol: battle_CLASS_VRAM }
  world_model_anim: { vram: 0x80234000, vram_symbol: Vine0Base }
  world_script_api: { vram: 0x80280000, follows: [heaps2] }
  world_use_item: { vram: 0x802C0000, follows: [model_clear_render_tasks] }

segments:
  # Runtime overlays are discovered from their source families and built
  # separately; this list contains only resident code and asset/data segments.
  - { name: header }
  - { name: boot, vram: 0xA4000040 }
  - { name: main, class: main }
  - { name: engine1, class: engine1 }
  - { name: engine2, class: engine2 }
  - { name: heaps, class: heaps, subalign: 4096 }
  - { name: heaps_legacy, class: heaps_legacy }
  - { name: evt, class: evt }
  - { name: engine4, class: engine4 }
  - { name: entity, class: entity }
  - { name: font_width, class: font_width }
  - { name: heaps3, class: heaps3 }
  - { name: charset, vram: 0x0 }
  - { name: menu_hud_scripts, class: menu_hud_scripts }
  - { name: pause, class: filemenu_pause }
  - { name: filemenu, class: filemenu_pause }
  - { name: battle, class: battle }
  - { name: icon }
  - { name: logos }
  - { name: title/bg_1 }
  - { name: title/bg_2 }
  - { name: title/bg_3 }
  - { name: title/bg_4 }
  - { name: title/tape }
  - { name: title/bowser_silhouette }
  - { name: imgfx_data, vram: 0x0 }
  - { name: sprite_shading_profiles }
  - { name: create_audio_system_obfuscated, vram: 0x80200000 }
  - { name: load_engine_data_obfuscated, vram: 0x80200080 }
  - { name: general_heap_create_obfuscated, vram: 0x802AE000 }
  - { name: battle_heap_create_obfuscated, vram: 0x802AE000 }
  - { name: obfuscation_shims, vram: 0x802B2000 }
  - { name: world_use_item, class: world_use_item }
  - { each: src/effects/gfx, class: effect_gfx }
  - { name: battle/area/kmr_part_1, class: battle_area }
  - { name: battle/area/kmr_part_2, class: battle_area }
  - { name: battle/area/kmr_part_3, class: battle_area }
  - { name: battle/area/mac, class: battle_area }
  - { name: battle/area/hos, class: battle_area }
  - { name: battle/area/nok, class: battle_area }
  - { name: battle/area/trd_part_1, class: battle_area }
  - { name: battle/area/trd_part_2, class: battle_area }
  - { name: battle/area/trd_part_3, class: battle_area }
  - { name: battle/area/iwa, class: battle_area }
  - { name: battle/area/sbk, class: battle_area, subalign: 16 }
  - { name: battle/area/isk_part_1, class: battle_area }
  - { name: battle/area/isk_part_2, class: battle_area }
  - { name: battle/area/mim, class: battle_area }
  - { name: battle/area/arn, class: battle_area }
  - { name: battle/area/dgb, class: battle_area }
  - { name: battle/area/omo, class: battle_area }
  - { name: battle/area/omo2, class: battle_area }
  - { name: battle/area/omo2_6, class: battle_area2 }
  - { name: battle/area/omo3, class: battle_area }
  - { name: battle/area/kgr, class: battle_area }
  - { name: battle/area/jan, class: battle_area }
  - { name: battle/area/jan2, class: battle_area }
  - { name: battle/area/kzn, class: battle_area }
  - { name: battle/area/kzn2, class: battle_area }
  - { name: battle/area/flo, class: battle_area }
  - { name: battle/area/flo2, class: battle_area }
  - { name: battle/area/tik, class: battle_area }
  - { name: battle/area/tik2, class: battle_area }
  - { name: battle/area/tik3, class: battle_area }
  - { name: battle/area/sam, class: battle_area }
  - { name: battle/area/sam2, class: battle_area }
  - { name: battle/area/pra, class: battle_area }
  - { name: battle/area/pra2, class: battle_area, subalign: 16 }
  - { name: battle/area/pra3, class: battle_area }
  - { name: battle/area/kpa, class: battle_area }
  - { name: battle/area/kpa2, class: battle_area }
  - { name: battle/area/kpa3, class: battle_area }
  - { name: battle/area/kpa4, class: battle_area }
  - { name: battle/area/kkj, class: battle_area }
  - { name: battle/area/dig, class: battle_area }
  - { name: level_up, class: battle_move }
  - { name: starpoint, class: battle_move }
  - { each: src/world/model_anim/kzn, class: world_model_anim }
  - { name: world_script_api, class: world_script_api }
  - { name: texture_memory, class: texture_memory }
  - { name: dgb_01_smash_bridges, class: dgb_01_smash_bridges }
  - { name: heaps2, class: heaps2 }
  - { name: inspect_icon, class: indicator_icon }
  - { name: speech_bubble, class: indicator_icon }
  - { name: pulse_stone, class: indicator_icon }
  - { name: i_spy, class: indicator_icon }
  - { name: model_clear_render_tasks, class: model_clear_render_tasks }
  - { each: src/entity/model, class: entity_model }
  - { each: src/entity/anim, class: entity_model_anim }
  - { name: sbn }
  - { name: copy_1942C40 }
  - { name: sprites }
  - { name: pad_1B82208 }
  - { name: copy_1B8220C }
  - { name: msg }
  - { name: unk_1C84D30 }
  - { name: copy_1E00000 }
  - { name: mapfs }
  - { name: copy_27FEE22, subalign: 2 }

# Which segment links each asset object, matched by the directory it sits in.
# A directory marked "each" gives every file its own segment, named by the
# file's stem with any prefix given.
assets:
  dirs:
    asm/effects: main
    ver/us/asm: header
    assets/us/imgfx: imgfx_data
    assets/us/logos: logos
    assets/us/sprite: sprites
    assets/us/ui/files: menu_hud_scripts
    assets/us/ui/pause: menu_hud_scripts
  each:
    assets/us/title: 'title/'
  files:
    ver/us/asm/header.s: header
    assets/us/audio.sbn: sbn
    assets/us/copy_1942C40.bin: copy_1942C40
    assets/us/copy_1B8220C.bin: copy_1B8220C
    assets/us/copy_1E00000.bin: copy_1E00000
    assets/us/copy_27FEE22.bin: copy_27FEE22
    assets/us/gspF3DEX2kawase_fifo_data.bin: main
    assets/us/gspF3DEX2kawase_fifo_text.bin: main
    assets/us/icons.bin: icon
    assets/us/libgcc_vr4300.a: main
    assets/us/mapfs.dat: mapfs
    assets/us/msg: msg
    assets/us/n_aspMain_data.bin: main
    assets/us/n_aspMain_text.bin: main
    assets/us/pad_1B82208.bin: pad_1B82208
    assets/us/rspboot_font.bin: boot
    assets/us/sprite_shading_profiles.bin: sprite_shading_profiles
    assets/us/unk_1C84D30.bin: unk_1C84D30

# Directories whose images are packed into a larger blob rather than being
# textures in their own right.
packed:
  - assets/us/sprite
  - assets/us/mapfs
  - assets/us/icon
  - assets/us/charset/standard
  - assets/us/charset/subtitle
  - assets/us/charset/title

# Fonts, each packed from the glyphs and palettes in its directory.
charsets:
  - standard
  - subtitle
  - title


# Where a segment's sources live.
#
# A directory belongs to the segment its path names, so src/battle/area/arn
# holds battle/area/arn and src/engine1 holds engine1. A directory that names
# no segment belongs to the one its parent does, and src itself is main, so
# adding a source file needs no entry here.
sources:
  # Directories whose segment is not the one their path names.
  dirs:
    src/world/area/dgb: dgb_01_smash_bridges

  # Directories where every source is its own segment, named <prefix><stem>.
  # Entries in the segment list may expand these families with `each`.
  each:
    src/battle/overlay: ''
    src/effects/gfx: effect_gfx_
    src/entity/anim: entity_anim_
    src/entity/model: entity_model_
    src/heaps: ''
    src/indicator_icon: ''
    src/obfuscated: ''
    src/world/model_anim/kzn: world_model_anim_kzn_

  # Sources the rules above cannot place.
  files:
    src/boot/entry_point.s: main
    src/boot/ipl3_boot.s: boot

  # Sources that build separately, or not for this version.
  exclude:
    - src/battle/actor/*
    - src/world/area/*/*/
    - src/os/padding_alt.s
    - src/os/skapi.s

# Compiler flags for sources that need something other than the default,
# by directory and then by file.
cflags:
  dirs:
    src/gcc: -g2
    src/os: -O3
    src/os/nusys: ''
  files:
    src/effects/aura.c: -Os
    src/effects/energy_in_out.c: -Os
    src/effects/firework_rocket.c: -Os
    src/effects/light_rays.c: -Os
    src/effects/stars_shimmer.c: -Os
    src/effects/tubba_heart_attack.c: -Os
    src/is_debug.c: -g -fforce-addr
    src/os/createmesgqueue.c: ''
    src/os/memset.c: -O1
    src/os/nusys/nugfxtaskmgr.c: -fforce-addr
    src/os/osFlash.c: ''
    src/os/osSiDeviceBusy.c: ''
    src/os/sqrtf.c: -ffast-math
    src/os/strcmp.c: -O1
    src/os/strcpy.c: -O1
    src/os/strncmp.c: ''
    src/os/vimodempallan1.c: ''
    src/os/vimodentsclan1.c: ''
    src/os/vimodepallan1.c: ''
