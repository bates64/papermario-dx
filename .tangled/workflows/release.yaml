when:
  - event: ["push"]
    tag: ["dx-*"]
  - event: ["push"]
    tag: ["v*"]

engine: nixery

dependencies:
  nixpkgs:
    - nix
    - awscli2

steps:
  - name: "Configure Nix caches"
    command: |
      cat >> /etc/nix/nix.conf <<EOF
      accept-flake-config = true
      extra-substituters = https://spindle:${ATTIC_TOKEN}@spindle-nix-cache.starhaven.dev/papermario-dx?priority=1
      extra-trusted-public-keys = papermario-dx:CnZCdSGA4n/b2AtneJYjPd/yAvfLPAdtlvkIs8sjrQQ=
      download-buffer-size = 536870912
      EOF

  - name: "Fix up FHS paths"
    command: |
      mkdir -p /usr/bin
      ln -sf "$(command -v env)" /usr/bin/env

  - name: "Fetch base ROM"
    command: |
      nix copy --from "https://spindle:${ATTIC_TOKEN}@spindle-nix-cache.starhaven.dev/papermario-dx" \
        /nix/store/vjr3l1g2smjzp3i2qwlm2v5fymhfzpmi-papermario.us.z64

  - name: "Build game"
    command: nix build .#default --out-link result

  - name: "Build dx-tag release artifacts"
    # dx-* tags ship the Windows toolchain, clangd index, and both Linux
    # unix-toolchain builds alongside the patch. plain version tags (v*)
    # ship only the patch file. aarch64-darwin has no builder on this host
    # and isn't cross-compiled by this flake, so it's not built here.
    command: |
      case "$TANGLED_REF_NAME" in
        dx-*)
          nix build .#windows-toolchain --out-link result-windows-toolchain
          nix build .#clangd-index --out-link result-clangd-index
          nix build .#packages.x86_64-linux.unix-toolchain --out-link result-toolchain-x86_64-linux
          nix build .#packages.aarch64-linux.unix-toolchain --out-link result-toolchain-aarch64-linux
          ;;
      esac

  - name: "Upload release artifacts to S3"
    command: |
      dest="s3://$S3_BUCKET/releases/$TANGLED_REF_NAME"
      cp result/papermario.bps "papermario-dx-${TANGLED_REF_NAME}.bps"
      aws --endpoint-url "$S3_ENDPOINT" s3 cp "papermario-dx-${TANGLED_REF_NAME}.bps" "$dest/"
      case "$TANGLED_REF_NAME" in
        dx-*)
          aws --endpoint-url "$S3_ENDPOINT" s3 cp result-windows-toolchain/papermario-dx-windows.zip "$dest/"
          aws --endpoint-url "$S3_ENDPOINT" s3 cp result-clangd-index/papermario-dx.idx "$dest/"
          for f in result-toolchain-x86_64-linux/papermario-dx-*.zip result-toolchain-aarch64-linux/papermario-dx-*.zip; do
            aws --endpoint-url "$S3_ENDPOINT" s3 cp "$f" "$dest/"
          done
          ;;
      esac
