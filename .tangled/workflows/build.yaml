when:
  - event: ["push"]
    branch: ["main"]
  - event: ["pull_request"]

engine: nixery

dependencies:
  nixpkgs:
    - nix

steps:
  - name: "Configure Nix caches"
    # spindle-nix-cache (ncps) is not added as a general substituter here:
    # it has a known bug where some upstream narinfo lookups fail with a
    # hard 500 ("invalid nar hash") instead of a clean 404, which breaks
    # automatic substitution for arbitrary packages. It's only used below,
    # explicitly, for the one path it's been verified to serve reliably.
    command: |
      cat >> /etc/nix/nix.conf <<EOF
      accept-flake-config = true
      extra-trusted-public-keys = spindle-nix-cache.starhaven.dev-1:ITs3A4uq6PjFUYIbtkPwoH03ii4K4uwsTDpfvovPKvs=
      EOF

  - name: "Fetch base ROM"
    # pkgs.requireFile sets allowSubstitutes = false, so it will never ask a
    # substituter for this path itself. Placing it in the local store first
    # (rather than relying on substitution) satisfies the check.
    command: |
      nix copy --from "https://spindle:${SPINDLE_NIX_CACHE_PASSWORD}@spindle-nix-cache.starhaven.dev" \
        /nix/store/vjr3l1g2smjzp3i2qwlm2v5fymhfzpmi-papermario.us.z64

  - name: "Build shell"
    command: nix develop --command true

  - name: "Configure"
    command: nix develop --command ./tools/configure.sh

  - name: "Build game"
    command: nix develop --command ninja

  - name: "Build patch file"
    command: nix develop --command ninja ver/us/build/papermario.bps
