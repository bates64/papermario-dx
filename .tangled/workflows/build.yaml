# Pulls from forks run here too. They get only the FORK_* secrets, so they read
# the Attic cache with FORK_ATTIC_TOKEN, which can't push. The steps that push
# to a cache skip themselves outside dx's own repository, including in a mod on
# this spindle, which carries dx's history and so this workflow.

when:
  - event: ["push"]
    branch: ["main"]
  # A pull_request trigger matches only the target branches it names.
  - event: ["pull_request"]
    branch: ["main", "release/*"]

engine: nixery

dependencies:
  nixpkgs:
    - nix
    - cachix
    - attic-client
    - xz
    - findutils
    - gnugrep
    - gnused
    - gawk
    - coreutils
    - bash

environment:
  TQDM_DISABLE: "1"

# The assets split from the baserom, and configure's stamps saying they're
# current, so configure doesn't split them again.
cache:
  - key: baserom-split
    fallback: true
    hash:
      - tools
      - ver/us/splat.yaml
    paths:
      - assets/us
      - ver/us/build/assets_dumped.stamp
      - ver/us/build/maps_dumped.stamp
      - ver/us/build/audio_dumped.stamp

steps:
  - name: "Configure Nix caches"
    # Attic runs on this same host, so it's listed ahead of cache.nixos.org
    # and Cachix (both over the public internet) via an explicit low
    # priority number - otherwise nix falls back to each cache's own
    # self-advertised priority, which doesn't reflect network distance.
    command: |
      cat >> /etc/nix/nix.conf <<EOF
      accept-flake-config = true
      extra-substituters = https://spindle:${FORK_ATTIC_TOKEN}@spindle-nix-cache.starhaven.dev/papermario-dx?priority=1
      extra-trusted-public-keys = papermario-dx:CnZCdSGA4n/b2AtneJYjPd/yAvfLPAdtlvkIs8sjrQQ=
      download-buffer-size = 536870912
      EOF

  - name: "Fix up FHS paths"
    # this minimal nixery container has no /usr/bin/env, so scripts with a
    # #!/usr/bin/env shebang (used throughout the build, not just by us)
    # can't be exec'd directly. coreutils provides env, just not at that path.
    command: |
      mkdir -p /usr/bin
      ln -sf "$(command -v env)" /usr/bin/env

  # Otherwise builds run as root, and can change the store paths they read.
  - name: "Add Nix build users"
    command: |
      echo "nixbld:x:30000:$(seq -s, -f nixbld%g 1 8)" >> /etc/group
      for i in $(seq 1 8); do
        echo "nixbld$i:x:$((30000 + i)):30000::/var/empty:/bin/false" >> /etc/passwd
      done
      echo "build-users-group = nixbld" >> /etc/nix/nix.conf

  - name: "List changed files"
    # For a pull, lists the files it changes in /tmp/changed-files, so the slow
    # checks below can skip what it can't affect. A push gets no list, and
    # every check runs in full. spindle's checkout is a single-commit shallow
    # clone with no shared history with the target branch, so this diffs trees
    # directly (two-dot) rather than from a merge base (three-dot). If the
    # target branch has moved on, the list also has the files it changed since,
    # which only makes the checks do more.
    #
    # The target branch is fetched from dx's repository by URL, since in a
    # pull from a fork, origin is the fork. If it can't be fetched, such as in
    # a mod whose branch dx doesn't have, there's no list either.
    command: |
      [ "$TANGLED_PIPELINE_KIND" = "pull_request" ] || exit 0
      set -euo pipefail
      if ! git fetch --depth=1 https://knot.starhaven.dev/did:plc:dfsxnyhzxwqpmykryrjtjabz "$TANGLED_PIPELINE_TARGET_BRANCH"; then
        echo "Couldn't fetch the target branch, so every check runs in full."
        exit 0
      fi
      # Written aside and moved into place, so a failed diff can't leave a
      # partial list behind.
      git diff --name-only FETCH_HEAD HEAD > /tmp/changed-files.partial
      mv /tmp/changed-files.partial /tmp/changed-files
      cat /tmp/changed-files

  - name: "Fetch base ROM"
    # pkgs.requireFile sets allowSubstitutes = false, so it will never ask a
    # substituter for this path itself. Placing it in the local store first
    # (rather than relying on substitution) satisfies the check.
    command: |
      nix copy --from "https://spindle:${FORK_ATTIC_TOKEN}@spindle-nix-cache.starhaven.dev/papermario-dx" \
        /nix/store/vjr3l1g2smjzp3i2qwlm2v5fymhfzpmi-papermario.us.z64

  - name: "Build shell"
    command: |
      nix develop --profile ./dev-profile --command true

  - name: "Push to Attic"
    # Attic skips pushing paths already signed by an "upstream cache" (e.g.
    # cache.nixos.org) by default, on the assumption that re-hosting them
    # is wasted disk space. Since the whole point here is a local copy that
    # avoids re-fetching those same paths from the internet, override that.
    command: |
      [ "${TANGLED_REPO_REPO_DID:-}" = did:plc:dfsxnyhzxwqpmykryrjtjabz ] || exit 0
      attic login spindle "https://spindle-nix-cache.starhaven.dev" "$ATTIC_TOKEN"
      attic push --ignore-upstream-cache-filter spindle:papermario-dx ./dev-profile

  - name: "Push to Cachix"
    command: |
      [ "${TANGLED_REPO_REPO_DID:-}" = did:plc:dfsxnyhzxwqpmykryrjtjabz ] || exit 0
      cachix push papermario-dx ./dev-profile

  - name: "Check formatting"
    # Needs only the development shell, so a formatting failure shows up
    # before the slow build steps run. A pull checks only the files it changes
    # that still exist, unless it changes how files are formatted.
    command: |
      if [ -f /tmp/changed-files ] && ! grep -qxE 'tools/format\.py|\.clang-format|flake\.(nix|lock)' /tmp/changed-files; then
        grep -E '\.(c|cpp|h|hpp)$' /tmp/changed-files | while IFS= read -r file; do
          if [ -f "$file" ]; then printf '%s\0' "$file"; fi
        done
      else
        git ls-files -z '*.c' '*.cpp' '*.h' '*.hpp'
      fi |
        nix develop --command xargs -0 -r -n 100 -P "$(nproc)" python3 tools/format.py --check

  - name: "Configure"
    command: |
      nix develop --command ./tools/configure.sh

  - name: "Build game"
    command: |
      nix develop --command tools/build_without_warnings.sh
      nix develop --command sccache --show-stats

  - name: "Build the toolchains"
    # The Windows and macOS toolchains are cross-compiled, and this host is
    # aarch64 Linux, so building them here also checks that they still build
    # on the machine that publishes them. A toolchain the cache already has
    # was built by an earlier run, so it isn't downloaded or built again.
    command: |
      set -euo pipefail
      # Caches each build as it finishes, so a run that fails later still saves
      # the next one rebuilding it.
      if [ "${TANGLED_REPO_REPO_DID:-}" = did:plc:dfsxnyhzxwqpmykryrjtjabz ]; then
        attic watch-store spindle:papermario-dx &
      fi
      cache="https://spindle:${FORK_ATTIC_TOKEN}@spindle-nix-cache.starhaven.dev/papermario-dx"
      for toolchain in unix windows macos-aarch64 macos-x86_64; do
        if nix path-info --store "$cache" "$(nix eval --raw ".#$toolchain-toolchain.outPath")" >/dev/null 2>&1; then
          echo "The cache has the $toolchain toolchain."
        else
          nix build ".#$toolchain-toolchain" --out-link "result-$toolchain"
        fi
      done

  - name: "Push the toolchains to Attic"
    # So the next run, and the publish workflow, get them from the cache
    # instead of compiling GCC again. The dev shell step above logged in.
    command: |
      [ "${TANGLED_REPO_REPO_DID:-}" = did:plc:dfsxnyhzxwqpmykryrjtjabz ] || exit 0
      set -- result-*
      [ -e "$1" ] || exit 0
      attic push spindle:papermario-dx "$@"

  - name: "Build the game with the Linux toolchain"
    # Builds the game again, in a clean copy, with the downloadable toolchain
    # instead of the development shell. The ROM must be the same. A pull that
    # changes neither the toolchain nor the build can't make them differ, so
    # it skips this.
    command: |
      set -euo pipefail
      if [ -f /tmp/changed-files ] && ! grep -qE '^(flake\.(nix|lock)|tools/|\.tangled/workflows/build\.yaml)' /tmp/changed-files; then
        echo "This pull changes neither the toolchain nor the build."
        exit 0
      fi
      nix build .#unix-toolchain --out-link result-unix
      expected=$(sha256sum ver/us/build/papermario.z64 | cut -d' ' -f1)
      rm -rf ../toolchain-check
      git clone --quiet "file://$PWD" ../toolchain-check
      cd ../toolchain-check
      cp /nix/store/vjr3l1g2smjzp3i2qwlm2v5fymhfzpmi-papermario.us.z64 ver/us/baserom.z64
      mkdir -p .dx
      tar -xJf "$OLDPWD"/result-unix/papermario-dx-linux-aarch64.tar.xz -C .dx
      mv .dx/papermario-dx-linux-aarch64 .dx/unix
      .dx/unix/activate.sh "$PWD/.dx/unix"
      export PATH="$PWD/.dx/unix/bin:$PATH" PYTHONPATH="$PWD/.dx/unix/python"
      python3 tools/build/configure.py
      ninja
      actual=$(sha256sum ver/us/build/papermario.z64 | cut -d' ' -f1)
      echo "Development shell ROM: $expected"
      echo "Toolchain ROM:         $actual"
      [ "$expected" = "$actual" ]

  - name: "Run clang-tidy"
    # A pull checks the sources its changes can affect (see tools/clang_tidy.sh).
    # A push checks every file.
    command: |
      if [ -f /tmp/changed-files ]; then
        nix develop --command bash -c 'mapfile -t files < /tmp/changed-files && tools/clang_tidy.sh "${files[@]}"'
      else
        nix develop --command tools/clang_tidy.sh
      fi

  - name: "Check struct offset comments"
    command: |
      nix develop --command python3 tools/audit_struct_layout.py --all
