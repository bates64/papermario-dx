# Builds every platform's toolchain on this one Linux host and publishes them
# to S3, where the download scripts find them (see tools/index_toolchains.sh).
# The Windows and macOS toolchains are cross-compiled. The x86_64 Linux one
# builds under this host's x86_64 emulation, except for Star Rod's jar, which
# is the same on every system and so built natively. The clangd index, which
# takes far longer, is published for releases only (see
# publish-clangd-index.yaml).
#
# Each step skips itself outside dx's own repository, such as in a mod, which
# carries dx's history and so this workflow.

when:
  # A release is pushed as a branch and a tag together, which starts only one
  # pipeline, so its patch branches are listed as well as its tags.
  - event: ["push"]
    branch: ["main", "release/*"]
  - event: ["push"]
    tag: ["dx-*"]

engine: nixery

dependencies:
  nixpkgs:
    - nix
    - attic-client
    - awscli2
    - git
    - bash
    - coreutils
    - gawk
    - gnugrep

steps:
  - name: "Configure Nix"
    command: |
      [ "${TANGLED_REPO_REPO_DID:-}" = did:plc:dfsxnyhzxwqpmykryrjtjabz ] || exit 0
      cat >> /etc/nix/nix.conf <<EOF
      accept-flake-config = true
      extra-substituters = https://spindle:${ATTIC_TOKEN}@spindle-nix-cache.starhaven.dev/papermario-dx?priority=1
      extra-trusted-public-keys = papermario-dx:CnZCdSGA4n/b2AtneJYjPd/yAvfLPAdtlvkIs8sjrQQ=
      extra-platforms = x86_64-linux
      download-buffer-size = 536870912
      EOF

  - name: "Fix up FHS paths"
    command: |
      [ "${TANGLED_REPO_REPO_DID:-}" = did:plc:dfsxnyhzxwqpmykryrjtjabz ] || exit 0
      mkdir -p /usr/bin
      ln -sf "$(command -v env)" /usr/bin/env

  - name: "Fetch base ROM"
    command: |
      [ "${TANGLED_REPO_REPO_DID:-}" = did:plc:dfsxnyhzxwqpmykryrjtjabz ] || exit 0
      nix copy --from "https://spindle:${ATTIC_TOKEN}@spindle-nix-cache.starhaven.dev/papermario-dx" \
        /nix/store/vjr3l1g2smjzp3i2qwlm2v5fymhfzpmi-papermario.us.z64

  - name: "Build and publish the toolchains"
    command: |
      [ "${TANGLED_REPO_REPO_DID:-}" = did:plc:dfsxnyhzxwqpmykryrjtjabz ] || exit 0
      set -euo pipefail
      # Caches each Nix build as it finishes, so a run that fails later still
      # saves the next one rebuilding it.
      attic login spindle https://spindle-nix-cache.starhaven.dev "$ATTIC_TOKEN"
      attic watch-store spindle:papermario-dx &

      export S3_ENDPOINT="https://fsn1.your-objectstorage.com"

      nix build .#unix-toolchain --out-link result-linux-aarch64
      tools/publish_toolchain.sh result-linux-aarch64/papermario-dx-linux-aarch64.tar.xz linux-aarch64.tar.xz tar.xz

      nix build .#windows-toolchain --out-link result-windows
      tools/publish_toolchain.sh result-windows/papermario-dx-windows.zip windows zip

      for arch in aarch64 x86_64; do
        nix build ".#macos-$arch-toolchain" --out-link "result-macos-$arch"
        tools/publish_toolchain.sh "result-macos-$arch/papermario-dx-macos-$arch.tar.xz" "macos-$arch.tar.xz" tar.xz
      done

      nix build .#packages.x86_64-linux.unix-toolchain-with-aarch64-jar --out-link result-linux-x86_64
      tools/publish_toolchain.sh result-linux-x86_64/papermario-dx-linux-x86_64.tar.xz linux-x86_64.tar.xz tar.xz

      # watch-store is killed when this step ends, which can be before it has
      # uploaded the last toolchain.
      attic push spindle:papermario-dx result-*

  - name: "Prune and index toolchains"
    command: |
      [ "${TANGLED_REPO_REPO_DID:-}" = did:plc:dfsxnyhzxwqpmykryrjtjabz ] || exit 0
      S3_ENDPOINT="https://fsn1.your-objectstorage.com" tools/index_toolchains.sh
