# Builds the clangd index for a release and publishes it to S3, where the
# configure script finds it. The index comes from a full build of the game, with
# no build cache, so it takes a while and is made for releases only. The
# configure script uses the newest commit's index that exists, so other commits
# use their release's. The first run also builds clangd-indexer from source,
# which takes hours; Attic keeps it after that.
#
# A release is pushed as a branch and a tag together, which starts only one
# pipeline, so this runs for every push to main or a release branch and each
# step does nothing unless the commit is tagged as a release. Run it by hand to
# make the index for any commit.
#
# Each step skips itself outside dx's own repository, such as in a mod, which
# carries dx's history and so this workflow.

when:
  - event: ["push"]
    branch: ["main", "release/*"]
  - event: ["push"]
    tag: ["dx-*"]
  - event: ["manual"]

engine: nixery

dependencies:
  nixpkgs:
    - nix
    - attic-client
    - awscli2
    - git
    - bash
    - coreutils

environment:
  TQDM_DISABLE: "1"

steps:
  - name: "Configure Nix"
    command: |
      [ "${TANGLED_REPO_REPO_DID:-}" = did:plc:dfsxnyhzxwqpmykryrjtjabz ] || exit 0
      [ "${TANGLED_PIPELINE_KIND:-}" = manual ] || [ -n "$(git tag --points-at HEAD --list 'dx-*')" ] || exit 0
      cat >> /etc/nix/nix.conf <<EOT
      accept-flake-config = true
      extra-substituters = https://spindle:${ATTIC_TOKEN}@spindle-nix-cache.starhaven.dev/papermario-dx?priority=1
      extra-trusted-public-keys = papermario-dx:CnZCdSGA4n/b2AtneJYjPd/yAvfLPAdtlvkIs8sjrQQ=
      download-buffer-size = 536870912
      EOT
      mkdir -p /usr/bin
      ln -sf "$(command -v env)" /usr/bin/env

  - name: "Fetch base ROM"
    command: |
      [ "${TANGLED_REPO_REPO_DID:-}" = did:plc:dfsxnyhzxwqpmykryrjtjabz ] || exit 0
      [ "${TANGLED_PIPELINE_KIND:-}" = manual ] || [ -n "$(git tag --points-at HEAD --list 'dx-*')" ] || exit 0
      nix copy --from "https://spindle:${ATTIC_TOKEN}@spindle-nix-cache.starhaven.dev/papermario-dx" \
        /nix/store/vjr3l1g2smjzp3i2qwlm2v5fymhfzpmi-papermario.us.z64

  - name: "Build clangd-indexer"
    # Its own step, so the cache has it even if the index build fails.
    command: |
      [ "${TANGLED_REPO_REPO_DID:-}" = did:plc:dfsxnyhzxwqpmykryrjtjabz ] || exit 0
      [ "${TANGLED_PIPELINE_KIND:-}" = manual ] || [ -n "$(git tag --points-at HEAD --list 'dx-*')" ] || exit 0
      set -euo pipefail
      attic login spindle https://spindle-nix-cache.starhaven.dev "$ATTIC_TOKEN"
      attic watch-store spindle:papermario-dx &
      nix build .#clangd-indexer --out-link result-clangd-indexer
      attic push spindle:papermario-dx result-clangd-indexer

  - name: "Build and publish the clangd index"
    command: |
      [ "${TANGLED_REPO_REPO_DID:-}" = did:plc:dfsxnyhzxwqpmykryrjtjabz ] || exit 0
      [ "${TANGLED_PIPELINE_KIND:-}" = manual ] || [ -n "$(git tag --points-at HEAD --list 'dx-*')" ] || exit 0
      set -euo pipefail
      nix build .#clangd-index --out-link result-clangd-index
      S3_ENDPOINT="https://fsn1.your-objectstorage.com" \
        tools/publish_toolchain.sh result-clangd-index/papermario-dx.idx clangd-index idx
